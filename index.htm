<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biobuzz Scorer</title>
    <link rel="icon" href="images/favicon.png">
    <style>
        body {
            overflow: hidden;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            align-items: center;
            min-height: 100vh; 
            display: grid;
            place-items: center;
            margin: 0px;
        }

        .card {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            margin: 0px;
        }
    </style>
</head>
<body>
    <div class="gallery">
        <div class="card">
            <img src="images/index.png" style="width: 45%">
            <img src="images/begin.png" style="width: 45%">
        </div>
    </div>
</body>
</html>
