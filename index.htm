<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biobuzz Scorer</title>
    <link rel="icon" href="images/favicon.png">
    <style>
        body {
            overflow: hidden;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            align-items: center;
            min-height: 100vh; 
            display: grid;
            place-items: center;
            margin: 0px;
        }

        .card {
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            margin: 0px;
        }

        button {
            padding: 0px;
            border: none;
            background-color: white;
        }
    </style>
</head>
<body>
    <div class="gallery">
        <div class="card">
            <img src="images/index.png" style="width: 45%">
            <button onclick = "begin(event)">
                <img src="images/begin.png" style="width: 45%">
            </button>
            
        </div>
    </div>
</body>
<script>
    function begin(event){
        event.preventDefault();
        window.location.href = "scorer.htm";
    }
</script>
</html>
